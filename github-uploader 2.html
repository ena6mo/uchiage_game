<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GitHub アップローダー</title>
<style>
  body { font-family: sans-serif; max-width: 500px; margin: 40px auto; padding: 20px; background: #1a1a2e; color: #eee; }
  h2 { color: #c49ad8; }
  input, textarea { width: 100%; padding: 10px; margin: 8px 0 16px; border: 1px solid #444; border-radius: 6px; background: #0f0f1a; color: #eee; box-sizing: border-box; }
  button { width: 100%; padding: 14px; background: #c49ad8; color: #000; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; font-weight: bold; }
  button:disabled { background: #555; color: #999; cursor: not-allowed; }
  #status { margin-top: 16px; padding: 12px; border-radius: 6px; display: none; }
  .success { background: #1a3a1a; border: 1px solid #4a8; color: #4a8; }
  .error   { background: #3a1a1a; border: 1px solid #a44; color: #f88; }
  .loading { background: #1a1a3a; border: 1px solid #44a; color: #88f; }
  label { font-size: 13px; color: #aaa; }
</style>
</head>
<body>
<h2>🎮 GitHub アップローダー</h2>
<p style="font-size:13px;color:#aaa;">uchiage-game.htmlをGitHubに直接アップロードします</p>

<label>Personal Access Token（repoスコープ）</label>
<input type="password" id="token" placeholder="ghp_xxxxxxxxxxxx">

<label>アップロードするファイルを選択</label>
<input type="file" id="file" accept=".html,.png,.jpg,.jpeg,.PNG">

<button onclick="upload()" id="btn">アップロード</button>

<div id="status"></div>

<script>
var OWNER = 'ena6mo';
var REPO  = 'uchiage_game';

async function upload() {
  var token = document.getElementById('token').value.trim();
  var file  = document.getElementById('file').files[0];
  var btn   = document.getElementById('btn');
  var status = document.getElementById('status');

  if (!token) { showStatus('トークンを入力してください', 'error'); return; }
  if (!file)  { showStatus('ファイルを選択してください', 'error'); return; }

  btn.disabled = true;
  showStatus('アップロード中...', 'loading');

  try {
    // ファイルをBase64に変換
    var base64 = await toBase64(file);

    // 既存ファイルのSHAを取得
    var sha = null;
    try {
      var getRes = await fetch(
        'https://api.github.com/repos/' + OWNER + '/' + REPO + '/contents/' + file.name,
        { headers: { 'Authorization': 'token ' + token, 'Accept': 'application/vnd.github.v3+json' } }
      );
      if (getRes.ok) {
        var getData = await getRes.json();
        sha = getData.sha;
      }
    } catch(e) {}

    // アップロード
    var body = {
      message: 'Update ' + file.name,
      content: base64,
    };
    if (sha) body.sha = sha;

    var putRes = await fetch(
      'https://api.github.com/repos/' + OWNER + '/' + REPO + '/contents/' + file.name,
      {
        method: 'PUT',
        headers: {
          'Authorization': 'token ' + token,
          'Accept': 'application/vnd.github.v3+json',
          'Content-Type': 'application/json',
        },
        body: JSON.stringify(body),
      }
    );

    if (putRes.ok) {
      showStatus('✅ ' + file.name + ' をアップロードしました！', 'success');
    } else {
      var err = await putRes.json();
      showStatus('❌ エラー: ' + (err.message || putRes.status), 'error');
    }
  } catch(e) {
    showStatus('❌ エラー: ' + e.message, 'error');
  }

  btn.disabled = false;
}

function toBase64(file) {
  return new Promise(function(resolve, reject) {
    var reader = new FileReader();
    reader.onload = function() {
      // data:xxx;base64, の部分を除去
      resolve(reader.result.split(',')[1]);
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function showStatus(msg, type) {
  var el = document.getElementById('status');
  el.textContent = msg;
  el.className = type;
  el.style.display = 'block';
}
</script>
</body>
</html>
