<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GitHub アップローダー</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:sans-serif;background:#0d0a0e;color:#ede6f5;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .wrap{width:100%;max-width:480px}
  h2{color:#c49ad8;margin-bottom:6px;font-size:20px}
  p{font-size:12px;color:#7a6a8a;margin-bottom:24px}
  label{font-size:11px;color:#9a8aaa;letter-spacing:.1em;display:block;margin-bottom:6px}
  input[type=password],input[type=file]{width:100%;padding:12px;margin-bottom:18px;border:1px solid #2e2040;border-radius:4px;background:#1c1628;color:#ede6f5;font-size:14px}
  input[type=file]{padding:8px;cursor:pointer}
  button{width:100%;padding:15px;background:#c49ad8;color:#000;border:none;border-radius:4px;font-size:15px;font-weight:bold;cursor:pointer;letter-spacing:.1em}
  button:disabled{background:#3a2a4a;color:#7a6a8a;cursor:not-allowed}
  #msg{margin-top:16px;padding:12px 16px;border-radius:4px;font-size:13px;display:none;line-height:1.6}
  .ok{background:#1a2e1a;border:1px solid #4a8a4a;color:#8ad88a}
  .ng{background:#2e1a1a;border:1px solid #8a4a4a;color:#d88a8a}
  .ing{background:#1a1a2e;border:1px solid #4a4a8a;color:#8a8ad8}
  .file-list{margin-top:8px;font-size:11px;color:#9a8aaa}
</style>
</head>
<body>
<div class="wrap">
  <h2>🎮 GitHub アップローダー</h2>
  <p>打ち上げは賞レースの後で - ファイル更新ツール</p>

  <label>Personal Access Token</label>
  <input type="password" id="token" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx">

  <label>アップロードするファイル（複数選択可）</label>
  <input type="file" id="files" multiple accept=".html,.png,.jpg,.jpeg,.PNG,.JPG">
  <div class="file-list" id="file-list"></div>

  <br>
  <button id="btn" onclick="uploadAll()">アップロード</button>
  <div id="msg"></div>
</div>

<script>
var OWNER = 'ena6mo';
var REPO  = 'uchiage_game';

document.getElementById('files').addEventListener('change', function() {
  var names = Array.from(this.files).map(function(f){ return f.name; });
  document.getElementById('file-list').textContent = names.length ? '選択中: ' + names.join(', ') : '';
});

async function uploadAll() {
  var token = document.getElementById('token').value.trim();
  var files  = document.getElementById('files').files;
  var btn    = document.getElementById('btn');
  var msg    = document.getElementById('msg');

  if (!token) { show('トークンを入力してください', 'ng'); return; }
  if (!files.length) { show('ファイルを選択してください', 'ng'); return; }

  btn.disabled = true;
  show('アップロード中... 0/' + files.length, 'ing');

  var ok = 0, ng = 0, results = [];

  for (var i = 0; i < files.length; i++) {
    var file = files[i];
    try {
      var b64 = await toBase64(file);
      var sha = await getSHA(token, file.name);
      var body = { message: 'Update ' + file.name, content: b64 };
      if (sha) body.sha = sha;

      var res = await fetch(
        'https://api.github.com/repos/' + OWNER + '/' + REPO + '/contents/' + file.name,
        {
          method: 'PUT',
          headers: {
            'Authorization': 'token ' + token,
            'Content-Type': 'application/json',
            'Accept': 'application/vnd.github.v3+json'
          },
          body: JSON.stringify(body)
        }
      );
      if (res.ok) {
        ok++;
        results.push('✅ ' + file.name);
      } else {
        var e = await res.json();
        ng++;
        results.push('❌ ' + file.name + ': ' + (e.message || res.status));
      }
    } catch(e) {
      ng++;
      results.push('❌ ' + file.name + ': ' + e.message);
    }
    show('アップロード中... ' + (ok+ng) + '/' + files.length + '\n' + results.join('\n'), 'ing');
  }

  var type = ng === 0 ? 'ok' : (ok === 0 ? 'ng' : 'ing');
  show(results.join('\n') + '\n\n' + ok + '件成功 / ' + ng + '件失敗', type);
  btn.disabled = false;
}

async function getSHA(token, filename) {
  try {
    var res = await fetch(
      'https://api.github.com/repos/' + OWNER + '/' + REPO + '/contents/' + filename,
      { headers: { 'Authorization': 'token ' + token, 'Accept': 'application/vnd.github.v3+json' } }
    );
    if (res.ok) { var d = await res.json(); return d.sha; }
  } catch(e) {}
  return null;
}

function toBase64(file) {
  return new Promise(function(resolve, reject) {
    var r = new FileReader();
    r.onload = function() { resolve(r.result.split(',')[1]); };
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

function show(msg, type) {
  var el = document.getElementById('msg');
  el.style.display = 'block';
  el.className = type;
  el.style.whiteSpace = 'pre-wrap';
  el.textContent = msg;
}
</script>
</body>
</html>
