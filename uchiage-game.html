<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;600&family=Shippori+Mincho:wght@400;600;800&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>打ち上げは賞レースの後で</title>
<style>

:root {
  --bg:#080608; --surface:#130f1a; --surface2:#1c1628;
  --border:#2e2040; --border-lit:#5a3a78;
  --accent:#c49ad8; --accent2:#e8c88a;
  --text:#ede6f5; --text-dim:#7a6a8a; --text-mid:#b0a0c0;
  --name-color:#ddb8f5;
  --choice-bg:rgba(28,18,40,0.96); --choice-hover:rgba(196,154,216,0.12);
  --glow2:rgba(232,200,138,0.1);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{font-family:'Noto Serif JP',serif;background:#080608;color:#ede6f5;height:100%;width:100%;overflow:hidden;touch-action:manipulation}

/* ===== SCREENS ===== */
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;opacity:0;transition:opacity 0.6s ease}
.screen.visible{display:flex}
.screen.shown{opacity:1}

/* ===== PARTICLES ===== */
#particles{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.particle{position:absolute;border-radius:50%;background:var(--accent);opacity:0;animation:drift linear infinite}
@keyframes drift{0%{transform:translateY(100vh) scale(0);opacity:0}10%{opacity:.35}90%{opacity:.1}100%{transform:translateY(-10vh) scale(1);opacity:0}}

/* ===== TITLE ===== */
#title-screen{background:radial-gradient(ellipse at 55% 35%,#241030 0%,#080608 65%);z-index:100}
.title-wrap{text-align:center;z-index:1}
.title-eyebrow{font-size:10px;letter-spacing:.6em;color:var(--text-dim);margin-bottom:28px;animation:fadeUp 1.4s ease both}
.title-main{font-family:'Shippori Mincho',serif;font-size:clamp(22px,4.5vw,48px);font-weight:800;letter-spacing:.14em;color:var(--accent);text-shadow:0 0 60px rgba(196,154,216,.5);margin-bottom:6px;animation:fadeUp 1.4s .1s ease both}
.title-rule{width:80px;height:1px;margin:24px auto;background:linear-gradient(90deg,transparent,var(--accent),transparent);animation:fadeUp 1.4s .2s ease both}
.title-sub{font-size:10px;letter-spacing:.5em;color:var(--text-dim);margin-bottom:48px;animation:fadeUp 1.4s .25s ease both}
.title-menu{display:flex;flex-direction:column;align-items:center;gap:12px;margin-bottom:32px;animation:fadeUp 1.4s .5s ease both}
.tmb{font-family:'Noto Serif JP',serif;font-size:13px;letter-spacing:.4em;color:var(--accent2);background:none;border:1px solid rgba(232,200,138,.35);padding:14px 0;cursor:pointer;transition:all .3s;width:240px;display:flex;align-items:center;justify-content:center;gap:10px;position:relative;overflow:hidden;-webkit-appearance:none;appearance:none}
.tmb::before{content:'';position:absolute;inset:0;background:var(--glow2);transform:scaleX(0);transform-origin:left;transition:transform .3s}
.tmb:hover::before{transform:scaleX(1)}
.tmb:hover{border-color:var(--accent2);box-shadow:0 0 24px rgba(232,200,138,.12)}
.tmb.sub{font-size:12px;color:var(--text-mid);border-color:rgba(176,160,192,.25);padding:12px 0}
.tmb.sub:hover{border-color:var(--accent);color:var(--accent)}
.tmb-icon{font-size:10px;opacity:.7}
.title-progress{animation:fadeUp 1.4s .7s ease both}
.prog-wrap{width:240px;height:2px;background:var(--border);margin:0 auto 10px;overflow:hidden}
.prog-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width 1s ease;box-shadow:0 0 8px var(--accent)}
.prog-text{font-size:10px;letter-spacing:.3em;color:var(--text-dim);text-align:center}

/* ===== NAME INPUT ===== */
#name-screen{background:radial-gradient(ellipse at 50% 55%,#1a1030 0%,#080608 65%);z-index:95}
.name-wrap{text-align:center;z-index:1}
.name-label{font-size:10px;letter-spacing:.5em;color:var(--text-dim);margin-bottom:40px}
.name-field{font-family:'Shippori Mincho',serif;font-size:22px;letter-spacing:.25em;background:transparent;border:none;border-bottom:1px solid var(--accent);color:#ede6f5 !important;-webkit-text-fill-color:#ede6f5 !important;text-align:center;width:260px;padding:10px 0;outline:none;caret-color:var(--accent)}
.btn{font-family:'Noto Serif JP',serif;font-size:13px;letter-spacing:.4em;color:var(--accent2);background:none;border:1px solid rgba(232,200,138,.35);padding:15px 52px;cursor:pointer;transition:all .35s;position:relative;overflow:hidden;margin-top:40px;-webkit-appearance:none;appearance:none}
.btn::before{content:'';position:absolute;inset:0;background:var(--glow2);transform:scaleX(0);transform-origin:left;transition:transform .35s}
.btn:hover::before{transform:scaleX(1)}
.btn:hover{border-color:var(--accent2);box-shadow:0 0 32px rgba(232,200,138,.15)}

/* ===== CHARA SELECT ===== */
#chara-screen{background:radial-gradient(ellipse at 45% 55%,#18102a 0%,#080608 65%);z-index:90}
.chara-label{font-size:10px;letter-spacing:.5em;color:var(--text-dim);margin-bottom:48px;z-index:1}
.chara-grid{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;max-width:680px;padding:0 20px;z-index:1}
.chara-card{width:116px;border:1px solid var(--border);padding:24px 12px 20px;cursor:pointer;text-align:center;transition:all .3s cubic-bezier(.34,1.56,.64,1);background:var(--surface);position:relative;overflow:hidden}
.chara-card::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:var(--accent);transform:scaleX(0);transition:transform .3s}
.chara-card:hover::after,.chara-card:active::after{transform:scaleX(1)}
.chara-card:hover,.chara-card:active{border-color:var(--border-lit);transform:translateY(-6px);box-shadow:0 16px 48px rgba(196,154,216,.15);background:var(--surface2)}
.chara-icon{width:60px;height:60px;border-radius:50%;background:var(--surface2);border:1px solid var(--border-lit);margin:0 auto 14px;display:flex;align-items:center;justify-content:center;font-size:22px}
.chara-name{font-size:12px;color:var(--name-color);line-height:1.7}
.chara-kana{font-size:9px;color:var(--text-dim);margin-top:5px;letter-spacing:.1em}

/* ===== GAME ===== */
#game-screen{position:fixed;inset:0;display:none;flex-direction:column;background:var(--bg);z-index:80}
#game-screen.visible{display:flex}
.scene-bg{flex:1;position:relative;overflow:hidden;background:linear-gradient(170deg,#1a1030 0%,#0a0814 100%);display:flex;align-items:center;justify-content:center}
.bg-img{position:absolute;inset:0;background-size:cover;background-position:center;transition:opacity .8s ease;opacity:0}
.bg-img.loaded{opacity:1}
.bg-overlay{position:absolute;inset:0;background:linear-gradient(0deg,rgba(8,6,8,.5) 0%,transparent 60%)}
.chara-stand{position:absolute;bottom:0;left:0;right:0;height:88%;display:flex;align-items:flex-end;justify-content:center;pointer-events:none}
.chara-slot{position:absolute;bottom:0;height:100%;display:flex;align-items:flex-end;justify-content:center;transition:opacity .4s}
.chara-slot img{height:100%;width:auto;object-fit:contain;object-position:bottom;filter:drop-shadow(0 0 30px rgba(196,154,216,.15))}
.chara-slot.pos-far-left{left:0%;transform:translateX(-10%);height:85%;z-index:1}
.chara-slot.pos-left{left:10%;transform:translateX(0%);height:88%;z-index:2}
.chara-slot.pos-center{left:50%;transform:translateX(-50%);height:92%;z-index:3}
.chara-slot.pos-right{right:10%;transform:translateX(0%);height:88%;z-index:2}
.chara-slot.pos-far-right{right:-2%;transform:translateX(8%);height:85%;z-index:1}
.chara-slot.pos-single{left:50%;transform:translateX(-50%);height:92%;z-index:3}
.chara-slot.pos-p1{left:0%;transform:translateX(0%);height:90%;z-index:2}
.chara-slot.pos-p2{left:22%;transform:translateX(-50%);height:90%;z-index:2}
.chara-slot.pos-p3{left:50%;transform:translateX(-50%);height:92%;z-index:3}
.chara-slot.pos-p4{right:22%;transform:translateX(50%);height:90%;z-index:2}
.chara-slot.pos-p5{right:0%;transform:translateX(0%);height:90%;z-index:2}
.chara-slot.size-full{height:92%}
.chara-slot.size-waist{height:160%;bottom:-58%}
.chara-slot.size-knee{height:115%;bottom:-18%}
.chara-placeholder{width:180px;height:100%;display:flex;align-items:center;justify-content:center;color:rgba(196,154,216,.15);font-size:10px;letter-spacing:.2em}
.ui-bar{position:absolute;top:0;left:0;right:0;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:14px 18px;background:linear-gradient(180deg,rgba(8,6,8,.75) 0%,transparent 100%)}
.ui-left{display:flex;gap:8px}
.ui-btn{font-size:10px;letter-spacing:.25em;color:var(--text-dim);background:rgba(8,6,8,.5);border:1px solid var(--border);padding:7px 14px;cursor:pointer;transition:all .2s;font-family:'Noto Serif JP',serif}
.ui-btn:hover{color:var(--accent);border-color:var(--border-lit);background:rgba(28,18,40,.8)}
.ui-btn.active{color:var(--accent);border-color:var(--accent);background:rgba(28,18,40,.8);box-shadow:0 0 12px rgba(196,154,216,.3)}
#choices-overlay{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:40px 24px;background:rgba(8,6,8,.65);backdrop-filter:blur(6px)}
#choices-overlay.hidden{display:none}
.choice-label{font-size:9px;letter-spacing:.6em;color:var(--text-dim);margin-bottom:6px}
.choice-btn{width:100%;max-width:500px;background:var(--choice-bg);border:1px solid var(--border);color:var(--text-mid);font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.7;padding:18px 28px;cursor:pointer;text-align:left;transition:all .25s;letter-spacing:.04em;position:relative;overflow:hidden}
.choice-btn::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--accent);transform:scaleY(0);transform-origin:top;transition:transform .25s}
.choice-btn:hover::before,.choice-btn:active::before{transform:scaleY(1)}
.choice-btn:hover,.choice-btn:active{background:var(--choice-hover);border-color:var(--border-lit);color:var(--text);padding-left:36px}

/* ===== TEXTBOX ===== */
.textbox{position:relative;background:rgba(8,6,8,.94);border-top:1px solid var(--border);height:200px;flex-shrink:0;cursor:pointer;user-select:none;-webkit-user-select:none;overflow:hidden}
.textbox:active{background:rgba(20,12,30,.96)}
.textbox-inner{padding:22px 28px 52px;height:100%;overflow:hidden}
.speaker-plate{display:inline-flex;align-items:center;margin-bottom:14px}
.speaker-bg{background:var(--surface2);border:1px solid var(--border-lit);border-right:none;padding:5px 16px 5px 14px;font-family:'Shippori Mincho',serif;font-size:13px;letter-spacing:.1em;color:var(--name-color);white-space:nowrap}
.speaker-tail{width:0;height:0;border-top:14px solid transparent;border-bottom:14px solid transparent;border-left:10px solid var(--border-lit);position:relative}
.speaker-tail::after{content:'';position:absolute;left:-11px;top:-13px;width:0;height:0;border-top:13px solid transparent;border-bottom:13px solid transparent;border-left:9px solid var(--surface2)}
.dialog-text{font-size:15px;line-height:2.1;color:var(--text);min-height:64px;white-space:pre-wrap}
.dialog-text.narration{color:var(--text-mid);font-size:14px;line-height:2.2;letter-spacing:.04em}
.typing-cursor::after{content:'|';color:var(--accent);opacity:.8;animation:blink .7s infinite}
.next-ind{position:absolute;bottom:16px;right:22px;display:flex;align-items:center;gap:8px;color:var(--text-dim);font-size:9px;letter-spacing:.35em;pointer-events:none;transition:opacity .3s}
.next-arrow{width:7px;height:7px;border-right:1px solid var(--accent);border-bottom:1px solid var(--accent);transform:rotate(45deg);animation:bounce 1.4s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:rotate(45deg) translateY(0)}50%{transform:rotate(45deg) translateY(3px)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}

/* ===== MENU ===== */
#menu-overlay{position:fixed;inset:0;z-index:200;background:rgba(8,6,8,.92);backdrop-filter:blur(12px);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px}
#menu-overlay.visible{display:flex}
.menu-title{font-size:10px;letter-spacing:.5em;color:var(--text-dim);margin-bottom:20px}
.menu-btn{font-family:'Noto Serif JP',serif;font-size:13px;letter-spacing:.3em;color:var(--text-mid);background:none;border:1px solid var(--border);padding:13px 0;cursor:pointer;transition:all .25s;width:240px;text-align:center}
.menu-btn:hover{border-color:var(--accent);color:var(--accent)}

/* ===== END ===== */
#end-screen{z-index:110;background:#080608}
.end-wrap{text-align:center;z-index:1}
.end-orn{width:40px;height:1px;background:var(--accent);margin:0 auto 24px;box-shadow:0 0 12px var(--accent)}
.end-type{font-size:10px;letter-spacing:.7em;color:var(--text-dim);margin-bottom:20px}
.end-title{font-family:'Shippori Mincho',serif;font-size:clamp(20px,3.5vw,34px);color:var(--accent);letter-spacing:.18em;margin-bottom:56px;text-shadow:0 0 40px rgba(196,154,216,.35)}

/* ===== COLLECTION ===== */
.coll-wrap{width:100%;max-width:760px;height:100vh;display:flex;flex-direction:column;z-index:1;overflow:hidden;box-sizing:border-box}
.coll-header{display:flex;align-items:center;justify-content:space-between;padding:20px 28px 16px;border-bottom:1px solid var(--border);flex-shrink:0}
.coll-back{font-family:'Noto Serif JP',serif;font-size:11px;letter-spacing:.3em;color:var(--text-dim);background:none;border:none;cursor:pointer;transition:color .2s}
.coll-back:hover{color:var(--accent)}
.coll-title{font-family:'Shippori Mincho',serif;font-size:12px;letter-spacing:.5em;color:var(--text-mid)}
.coll-count{font-size:11px;letter-spacing:.25em;color:var(--accent)}

/* ===== ENDING LIST ===== */
#ending-screen{background:radial-gradient(ellipse at 50% 40%,#1a1030 0%,#080608 60%);z-index:105;align-items:center}
.ending-grid{flex:1;overflow-y:auto;padding:24px 28px 40px;display:grid;grid-template-columns:repeat(5,1fr);gap:0}
.end-chara-cell{padding:12px 6px;text-align:center;border-bottom:1px solid var(--border);border-right:1px solid var(--border)}
.end-chara-cell:nth-child(5n){border-right:none}
.end-chara-emoji{font-size:18px;display:block;margin-bottom:4px}
.end-chara-name{font-size:9px;color:var(--text-dim);letter-spacing:.05em;line-height:1.4}
.end-card{border-bottom:1px solid var(--border);border-right:1px solid var(--border);padding:14px 8px;text-align:center;min-height:90px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.end-card:nth-child(5n){border-right:none}
.end-card.locked{background:repeating-linear-gradient(45deg,rgba(255,255,255,.01) 0,rgba(255,255,255,.01) 2px,transparent 2px,transparent 8px)}
.badge{font-size:8px;letter-spacing:.3em;padding:3px 8px}
.badge.happy{color:var(--accent2);border:1px solid rgba(232,200,138,.4)}
.badge.normal{color:var(--accent);border:1px solid rgba(196,154,216,.4)}
.badge.bad{color:#c07080;border:1px solid rgba(192,112,128,.4)}
.end-card-title{font-size:11px;color:var(--text);letter-spacing:.05em;line-height:1.5}
.end-lock{font-size:20px;opacity:.15}

/* ===== STILL GALLERY ===== */
#still-screen{background:radial-gradient(ellipse at 50% 40%,#1a1030 0%,#080608 60%);z-index:105;align-items:center}
.still-grid{flex:1;overflow-y:auto;padding:20px 16px 40px;display:flex;flex-direction:column;gap:0;width:100%;box-sizing:border-box}
.still-card{aspect-ratio:3/4;border:1px solid var(--border);position:relative;overflow:hidden;cursor:pointer;transition:all .3s;background:var(--surface);display:flex;flex-direction:column}
.still-card:hover{border-color:var(--accent);transform:scale(1.02)}
.still-card.locked{cursor:default}
.still-card.locked:hover{border-color:var(--border);transform:none}
.still-img-wrap{flex:1;overflow:hidden;min-height:0}
.still-img-wrap img{width:100%;height:100%;object-fit:cover;display:block}
.still-lock-box{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:repeating-linear-gradient(45deg,rgba(255,255,255,.01) 0,rgba(255,255,255,.01) 2px,transparent 2px,transparent 8px)}
.still-lock-icon{font-size:22px;opacity:.15}
.still-lock-name{font-size:9px;color:var(--text-dim);letter-spacing:.1em}
.still-label{flex-shrink:0;padding:7px 8px;background:var(--surface2);border-top:1px solid var(--border);font-size:9px;color:var(--text-mid);letter-spacing:.1em;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.still-chara-cards{display:grid;grid-template-columns:repeat(3,1fr);column-gap:10px;row-gap:20px;width:100%;margin-top:8px}
.still-section{padding:16px 0 14px;display:flex;align-items:center;gap:10px;width:100%;min-width:0;border-top:1px solid var(--border-lit)}
.still-section-line{flex:1;height:1px;background:var(--border)}
.still-section-name{font-size:11px;letter-spacing:.35em;color:var(--name-color);white-space:nowrap;font-family:'Shippori Mincho',serif}
.still-spacer{height:60px;width:100%;display:block}

/* ===== 好感度バー ===== */
#affinity-bar {
  position:absolute; top:0; left:0; right:0; z-index:11;
  display:none; align-items:center; justify-content:center;
  padding:10px 20px; gap:10px;
  background:linear-gradient(180deg,rgba(8,6,8,.8) 0%,transparent 100%);
  pointer-events:none;
}
#affinity-bar.visible { display:flex; }
.aff-label { font-size:9px; letter-spacing:.3em; color:var(--text-dim); white-space:nowrap; }
.aff-track { flex:1; max-width:160px; height:3px; background:var(--border); position:relative; }
.aff-fill { height:100%; background:linear-gradient(90deg,var(--accent),var(--accent2)); transition:width .6s ease; box-shadow:0 0 6px var(--accent); }
.aff-val { font-size:9px; letter-spacing:.2em; color:var(--accent); min-width:32px; text-align:right; }
.aff-heart { font-size:11px; animation:heartbeat .8s ease-in-out; }
@keyframes heartbeat { 0%,100%{transform:scale(1)} 50%{transform:scale(1.4)} }

/* ===== シーンタイトル ===== */
#scene-title-overlay {
  position:absolute; inset:0; z-index:15;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  background:rgba(8,6,8,.7); backdrop-filter:blur(4px);
  opacity:0; pointer-events:none; transition:opacity .5s;
}
#scene-title-overlay.visible { opacity:1; pointer-events:auto; }
.scene-title-line { width:40px; height:1px; background:var(--accent); margin:0 auto 16px; }
.scene-title-text { font-family:'Shippori Mincho',serif; font-size:clamp(14px,3vw,20px); letter-spacing:.3em; color:var(--accent); text-align:center; }
.scene-title-tap { margin-top:20px; font-size:9px; letter-spacing:.4em; color:var(--text-dim); animation:blink 1.4s infinite; }
#still-viewer{position:fixed;inset:0;z-index:300;background:rgba(8,6,8,.96);backdrop-filter:blur(8px);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer}
#still-viewer.hidden{display:none}
#still-viewer img{max-width:90vw;max-height:75vh;object-fit:contain;border:1px solid var(--border)}
.viewer-caption{margin-top:16px;font-size:12px;letter-spacing:.3em;color:var(--text-mid)}
.viewer-close{margin-top:12px;font-size:9px;letter-spacing:.4em;color:var(--text-dim)}

@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
::-webkit-scrollbar{display:none}
</style>
</head>
<body>

<div id="particles"></div>

<!-- タイトル -->
<div id="title-screen" class="screen visible shown">
  <div class="title-wrap">
    <div class="title-eyebrow">VISUAL NOVEL</div>
    <div class="title-main">打ち上げは賞レースの後で</div>
    <div class="title-rule"></div>
    <div class="title-sub">A STORY OF AWARDS AND FEELINGS</div>
    <div class="title-menu">
      <button class="tmb" onclick="goToName()"><span class="tmb-icon">▷</span>は じ め る</button>
      <button class="tmb sub" onclick="openEnding()"><span class="tmb-icon">◈</span>エンディング</button>
      <button class="tmb sub" onclick="openStill()"><span class="tmb-icon">◇</span>ス チ ル</button>
      <button class="tmb sub" onclick="openSaveMenu('load')"><span class="tmb-icon">↺</span>つづきから</button>
    </div>
    <div class="title-progress">
      <div class="prog-wrap"><div class="prog-fill" id="prog-fill"></div></div>
      <div class="prog-text" id="prog-text">0 / 15 END　│　0 STILL</div>
    </div>
  </div>
</div>

<!-- 名前入力 -->
<div id="name-screen" class="screen">
  <div class="name-wrap">
    <div class="name-label">主人公の名前を入力してください</div>
    <input class="name-field" id="name-field" type="text" value="松樹　真琴" maxlength="12">
    <br>
    <button class="btn" onclick="confirmName()">決　定</button>
  </div>
</div>

<!-- キャラ選択（分岐後用） -->
<div id="chara-screen" class="screen">
  <div class="chara-label">― 攻略キャラクターを選んでください ―</div>
  <div class="chara-grid" id="chara-grid"></div>
</div>

<!-- ゲーム -->
<div id="game-screen">
  <div class="scene-bg">
    <div class="bg-img" id="bg-img"></div>
    <div class="bg-overlay"></div>
    <div class="chara-stand" id="chara-stand"></div>
    <div class="ui-bar">
      <div class="ui-left">
        <button class="ui-btn" onclick="openMenu()">MENU</button>
        <button class="ui-btn" id="auto-btn" onclick="toggleAuto()">AUTO</button>
        <button class="ui-btn" id="skip-btn" onclick="toggleSkip()">SKIP</button>
      </div>
      <div style="font-size:9px;letter-spacing:.3em;color:var(--text-dim)" id="chara-label"></div>
    </div>
    <!-- 好感度バー -->
    <div id="affinity-bar">
      <div class="aff-label" id="aff-chara-name"></div>
      <div class="aff-track"><div class="aff-fill" id="aff-fill"></div></div>
      <div class="aff-val" id="aff-val">0 / 12</div>
      <div class="aff-heart" id="aff-heart" style="opacity:0">💜</div>
    </div>
    <!-- シーンタイトル -->
    <div id="scene-title-overlay" onclick="closeSceneTitle()">
      <div class="scene-title-line"></div>
      <div class="scene-title-text" id="scene-title-text"></div>
      <div class="scene-title-line"></div>
      <div class="scene-title-tap">TAP TO CONTINUE</div>
    </div>
    <div id="choices-overlay" class="hidden">
      <div class="choice-label">― 選択してください ―</div>
    </div>
  </div>
  <div class="textbox" id="textbox" onclick="nextScene()">
    <div class="textbox-inner">
      <div class="speaker-plate" id="speaker-plate">
        <div class="speaker-bg" id="speaker-name"></div>
        <div class="speaker-tail" id="speaker-tail"></div>
      </div>
      <div class="dialog-text" id="dialog-text"></div>
    </div>
    <div class="next-ind" id="next-ind" style="opacity:0">
      <span>TAP</span><div class="next-arrow"></div>
    </div>
  </div>
</div>

<!-- メニュー -->
<div id="menu-overlay">
  <div class="menu-title">― MENU ―</div>
  <button class="menu-btn" onclick="closeMenu()">ゲームに戻る</button>
  <button class="menu-btn" onclick="openSaveMenu('save')">セーブ</button>
  <button class="menu-btn" onclick="openSaveMenu('load')">ロード</button>
  <button class="menu-btn" onclick="closeMenu();backToTitle()">タイトルへ戻る</button>
</div>

<!-- セーブ・ロードメニュー -->
<div id="save-menu" style="position:fixed;inset:0;z-index:250;background:rgba(8,6,8,.95);backdrop-filter:blur(12px);align-items:center;justify-content:center;gap:14px;display:none;flex-direction:column;">
  <div id="save-menu-title" style="font-size:12px;letter-spacing:.6em;color:var(--text-dim);margin-bottom:8px;">S A V E</div>
  <div id="save-slots" style="width:100%;max-width:400px;display:flex;flex-direction:column;gap:10px;padding:0 24px;"></div>
  <button class="menu-btn" style="margin-top:12px;" onclick="closeSaveMenu()">キャンセル</button>
</div>

<!-- トースト通知 -->
<div id="save-toast" style="position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:rgba(28,18,40,.95);border:1px solid var(--border-lit);color:var(--accent);font-size:11px;letter-spacing:.25em;padding:10px 28px;z-index:300;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;"></div>

<!-- エンド -->
<div id="end-screen" class="screen">
  <div class="end-wrap">
    <div class="end-orn"></div>
    <div class="end-type" id="end-type">HAPPY END</div>
    <div class="end-title" id="end-title"></div>
    <div class="end-orn"></div>
    <br><br>
    <button class="btn" onclick="backToTitle()">タイトルへ戻る</button>
  </div>
</div>

<!-- エンディングリスト -->
<div id="ending-screen" class="screen">

    <div class="ending-grid" id="ending-grid"></div>

</div>

<!-- スチル -->

    { type:"dialog", speaker:"狐宮 浩信（こみや ひろのぶ）", charas:[{file:"komiya_normal_rafu.png",pos:"center",size:"waist"}], text:'「そうそう、それ。ありがとう」', firstAppear:true },

    { type:"dialog", speaker:"狐宮 浩信", text:'「だって事実じゃん！」' },
    { type:"dialog", speaker:"narration", text:'後ろから現れたのは、対照的に落ち着いた雰囲気の男性。' },
    { type:"dialog", speaker:"逢田 周二（あいだ しゅうじ）", charas:[{file:"komiya_normal_rafu.png",pos:"left",size:"waist"},{file:"aida_normal_rafu.png",pos:"right",size:"waist"}], text:'「すみません、こいつ変なこと言ってませんでした？」', firstAppear:true },

// セーブデータ
// ============================================================
var saveData = { ends:{}, stills:{}, clearedCommon:false };
var affinity = {};
var MAX_AFFINITY = 12;
var shownFurigana = {};

// フリガナ初回のみ表示
function getDisplayName(rawName) {
  var m = rawName.match(/^(.+?)（(.+?)）$/);
  if (!m) return rawName;
  var base = m[1];
  if (shownFurigana[base]) return base;
  shownFurigana[base] = true;
  return rawName;
}

// ============================================================
// セーブ・ロード（localStorage 5スロット）
// ============================================================
var SAVE_KEY = 'uchiage_save_';

function buildSaveState() {
  return {
    heroName: heroName,
    currentCharaId: currentChara ? currentChara.id : null,
    currentRoute: currentRoute,
    currentIndex: currentIndex,
    affinity: affinity,
    clearedCommon: saveData.clearedCommon,
    ends: saveData.ends,
    stills: saveData.stills,
    shownFurigana: shownFurigana,
    timestamp: new Date().toLocaleString('ja-JP'),
    routeLabel: currentChara ? currentChara.name + 'ルート' : '共通ルート',
  };
}

function saveGame(slot) {
  try {
    localStorage.setItem(SAVE_KEY + slot, JSON.stringify(buildSaveState()));
    refreshSaveSlots();
    showSaveToast('セーブしました　SLOT ' + slot);
  } catch(e) { showSaveToast('セーブに失敗しました'); }
}

function loadGame(slot) {
  try {
    var raw = localStorage.getItem(SAVE_KEY + slot);
    if (!raw) { showSaveToast('データがありません'); return; }
    var s = JSON.parse(raw);
    heroName = s.heroName || '松樹　真琴';
    currentRoute = s.currentRoute || 'common';
    currentIndex = s.currentIndex || 0;
    affinity = s.affinity || {};
    shownFurigana = s.shownFurigana || {};
    saveData.clearedCommon = s.clearedCommon || false;
    saveData.ends = s.ends || {};
    saveData.stills = s.stills || {};
    currentChara = s.currentCharaId ? CHARACTERS.find(function(c){ return c.id === s.currentCharaId; }) : null;
    closeSaveMenu();
    closeMenu();
    ['title-screen','name-screen','chara-screen','end-screen'].forEach(function(id){
      var el = document.getElementById(id);
      el.classList.remove('shown','visible');
    });
    document.getElementById('game-screen').classList.add('visible');
    document.getElementById('chara-label').textContent = currentChara ? currentChara.name : '';
    if (currentChara) updateAffinityBar(currentChara.id);
    updateProgress();
    renderScene();
    showSaveToast('ロードしました　SLOT ' + slot);
  } catch(e) { showSaveToast('ロードに失敗しました'); }
}

function deleteSave(slot) {
  localStorage.removeItem(SAVE_KEY + slot);
  refreshSaveSlots();
  showSaveToast('削除しました　SLOT ' + slot);
}

function getSaveInfo(slot) {
  try {
    var raw = localStorage.getItem(SAVE_KEY + slot);
    return raw ? JSON.parse(raw) : null;
  } catch(e) { return null; }
}

function showSaveToast(msg) {
  var t = document.getElementById('save-toast');
  t.textContent = msg;
  t.classList.add('visible');
  setTimeout(function(){ t.classList.remove('visible'); }, 2200);
}

function openSaveMenu(mode) {
  document.getElementById('menu-overlay').classList.remove('visible');
  var el = document.getElementById('save-menu');
  el.dataset.mode = mode;
  document.getElementById('save-menu-title').textContent = mode === 'save' ? 'S A V E' : 'L O A D';
  refreshSaveSlots();
  el.style.display = 'flex';
}
function closeSaveMenu() {
  document.getElementById('save-menu').style.display = 'none';
}

function refreshSaveSlots() {
  var mode = document.getElementById('save-menu').dataset.mode || 'save';
  var container = document.getElementById('save-slots');
  container.innerHTML = '';
  for (var i = 1; i <= 5; i++) {
    var info = getSaveInfo(i);
    var slot = document.createElement('div');
    slot.className = 'save-slot' + (info ? ' filled' : '');
    if (info) {
      slot.innerHTML = '<div class="save-slot-num">SLOT ' + i + '</div><div class="save-slot-route">' + info.routeLabel + '</div><div class="save-slot-time">' + info.timestamp + '</div>';
      var del = document.createElement('button');
      del.className = 'save-del-btn';
      del.textContent = '✕';
      (function(n){ del.onclick = function(e){ e.stopPropagation(); deleteSave(n); }; })(i);
      slot.appendChild(del);
    } else {
      slot.innerHTML = '<div class="save-slot-num">SLOT ' + i + '</div><div class="save-slot-empty">― 空きスロット ―</div>';
    }
    (function(n, hasData){
      slot.onclick = function(){
        if (mode === 'save') saveGame(n);
        else if (hasData) loadGame(n);
        else showSaveToast('データがありません');
      };
    })(i, !!info);
    container.appendChild(slot);
  }
}

function getAffinity(charaId) {
  return affinity[charaId] || 0;
}
function addAffinity(charaId, val) {
  if (!charaId) return;
  affinity[charaId] = Math.min(MAX_AFFINITY, Math.max(0, (affinity[charaId] || 0) + val));
  updateAffinityBar(charaId);
}
function updateAffinityBar(charaId) {
  var chara = CHARACTERS.find(function(c){ return c.id === charaId; });
  if (!chara) return;
  var val = getAffinity(charaId);
  var pct = (val / MAX_AFFINITY) * 100;
  document.getElementById("aff-chara-name").textContent = chara.name;
  document.getElementById("aff-fill").style.width = pct + "%";
  document.getElementById("aff-val").textContent = val + " / " + MAX_AFFINITY;
  // ハート点滅
  var heart = document.getElementById("aff-heart");
  heart.style.opacity = "1";
  heart.style.animation = "none";
  setTimeout(function(){ heart.style.animation = "heartbeat .8s ease-in-out"; }, 10);
  setTimeout(function(){ heart.style.opacity = "0"; }, 1200);
  document.getElementById("affinity-bar").classList.add("visible");
}

function unlockEnd(charaId, endKey) {
  var k = charaId + "_" + endKey;
  saveData.ends[k] = true;
  updateProgress();
}
function unlockStill(stillId) {
  saveData.stills[stillId] = true;
  updateProgress();
}
function updateProgress() {
  var ec = Object.keys(saveData.ends).length;
  var sc = Object.keys(saveData.stills).length;
  var pct = (ec / 15) * 100;
  document.getElementById("prog-fill").style.width = pct + "%";
  document.getElementById("prog-text").textContent = ec + " / 15 END　│　" + sc + " STILL";
  var ec2 = document.getElementById("end-count");
  if (ec2) ec2.textContent = ec + " / 15";
  var sc2 = document.getElementById("still-count");
  if (sc2) sc2.textContent = sc + " / 15";
}

// ============================================================
// シーン描画
// ============================================================
function renderScene() {
  var scenes = SCENARIO[currentRoute];
  if (!scenes || currentIndex >= scenes.length) return;
  var scene = scenes[currentIndex];

  document.getElementById("choices-overlay").classList.add("hidden");
  document.getElementById("next-ind").style.opacity = "0";
  document.getElementById("textbox").style.pointerEvents = "auto";

  if (scene.bg) setBg(scene.bg);
  // 複数立ち絵対応
  if (scene.charas !== undefined) {
    setCharaImgs(scene.charas);
  } else if (scene.chara !== undefined) {
    // 後方互換：chara単体指定はcenterに
    setCharaImgs(scene.chara ? [{file:scene.chara, pos:'single'}] : []);
  }

  if (scene.type === "dialog") {
    var isNarration = (scene.speaker === "narration");
    var plate = document.getElementById("speaker-plate");
    var nameEl = document.getElementById("speaker-name");
    var tail = document.getElementById("speaker-tail");
    var textEl = document.getElementById("dialog-text");

    if (isNarration) {
      plate.style.display = "none";
      textEl.classList.add("narration");
    } else {
      plate.style.display = "inline-flex";
      textEl.classList.remove("narration");
      // フリガナ付きspeakerをそのまま表示（初登場時のみ付与してある）
      var rawName = (scene.speaker === "heroine") ? heroName : scene.speaker;
      nameEl.textContent = getDisplayName(rawName);
      nameEl.style.fontSize = "";
      tail.style.display = "block";
    }
    var txt = scene.text.replace(/\[主人公\]/g, heroName);
    startTyping(txt);
  }
  else if (scene.type === "choice") {
    document.getElementById("speaker-plate").style.display = "none";
    document.getElementById("dialog-text").textContent = "";
    document.getElementById("dialog-text").classList.remove("narration");
    document.getElementById("textbox").style.pointerEvents = "none";
    showChoices(scene.choices);
  }
  else if (scene.type === "jump") {
    currentRoute = scene.next;
    currentIndex = 0;
    renderScene();
  }
  else if (scene.type === "scene_title") {
    document.getElementById("scene-title-text").textContent = scene.text;
    document.getElementById("scene-title-overlay").classList.add("visible");
    document.getElementById("textbox").style.pointerEvents = "none";
  }
  else if (scene.type === "chara_select") {
    saveData.clearedCommon = true;
    document.getElementById("game-screen").classList.remove("visible");
    document.getElementById("affinity-bar").classList.remove("visible");
    setTimeout(function() { showCharaSelect(); }, 300);
  }
  else if (scene.type === "end") {
    setTimeout(function() { showEnd(scene.endType, scene.endTitle); }, 600);
  }
}

// ============================================================
// テキスト表示（ページ分割）
// ============================================================
var MAX_PER_PAGE = 76;

function splitPages(text) {
  var lines = text.split("\n");
  var pages = [];
  var cur = "";
  for (var i = 0; i < lines.length; i++) {
    var line = lines[i];
    var joined = cur ? cur + "\n" + line : line;
    if (joined.length > MAX_PER_PAGE && cur) {
      pages.push(cur);
      cur = line;
    } else {
      cur = joined;
    }
  }
  if (cur) pages.push(cur);
  return pages;
}

function startTyping(text) {
  var pages = splitPages(text);
  pageQueue = pages.length > 1 ? pages.slice(1) : [];
  typePage(pages[0]);
}

function typePage(text) {
  isTyping = true;
  fullText = text;
  var el = document.getElementById("dialog-text");
  el.textContent = "";
  el.classList.add("typing-cursor");
  document.getElementById("next-ind").style.opacity = "0";
  var chars = Array.from(text);
  var i = 0;
  clearInterval(typeTimer);
  var speed = isSkip ? 6 : 36;
  typeTimer = setInterval(function() {
    el.textContent += chars[i];
    i++;
    if (i >= chars.length) {
      clearInterval(typeTimer);
      el.classList.remove("typing-cursor");
      isTyping = false;
      document.getElementById("next-ind").style.opacity = "1";
      if (isAuto || isSkip) {
        autoTimer = setTimeout(nextScene, isSkip ? 80 : 2000);
      }
    }
  }, speed);
}

function nextScene() {
  if (!document.getElementById("choices-overlay").classList.contains("hidden")) return;
  clearTimeout(autoTimer);
  if (isTyping) {
    clearInterval(typeTimer);
    var el = document.getElementById("dialog-text");
    el.textContent = fullText;
    el.classList.remove("typing-cursor");
    isTyping = false;
    document.getElementById("next-ind").style.opacity = "1";
    if (isAuto || isSkip) autoTimer = setTimeout(nextScene, isSkip ? 80 : 2000);
    return;
  }
  if (pageQueue.length > 0) {
    typePage(pageQueue.shift());
    return;
  }
  currentIndex++;
  renderScene();
}

// 選択肢
// ============================================================
function showChoices(choices) {
  var overlay = document.getElementById("choices-overlay");
  overlay.classList.remove("hidden");
  var old = overlay.querySelectorAll(".choice-btn");
  for (var i = 0; i < old.length; i++) old[i].remove();
  for (var j = 0; j < choices.length; j++) {
    (function(c) {
      var btn = document.createElement("button");
      btn.className = "choice-btn";
      btn.textContent = c.label;
      btn.onclick = function(e) {
        e.stopPropagation();
        // 好感度加算
        if (c.affinity && currentChara) {
          addAffinity(currentChara.id, c.affinity);
        }
        selectChoice(c.next);
      };
      overlay.appendChild(btn);
    })(choices[j]);
  }
}

  document.getElementById("scene-title-overlay").classList.remove("visible");
  document.getElementById("textbox").style.pointerEvents = "auto";
  currentIndex++;
  renderScene();
}

function selectChoice(next) {
  document.getElementById("choices-overlay").classList.add("hidden");
  currentRoute = next;
  currentIndex = 0;
  renderScene();
}

    var list = STILLS.filter(function(s) { return s.charaId === chara.id; });

    if (!isFirst) {
      var sp = document.createElement("div");
      sp.className = "still-spacer";
      grid.appendChild(sp);

    isFirst = false;
    // キャラブロック（見出し＋カードグリッド）

    block.style.cssText = "width:100%";
    var sec = document.createElement("div");
    sec.className = "still-section";
    sec.innerHTML = '<div class="still-section-line"></div><div class="still-section-name">' + chara.emoji + "　" + chara.name + '</div><div class="still-section-line"></div>';
    block.appendChild(sec);
    var cardGrid = document.createElement("div");
    cardGrid.className = "still-chara-cards";
    list.forEach(function(s) {
      var unlocked = !!saveData.stills[s.id];
      var card = document.createElement("div");
      card.className = "still-card" + (unlocked ? "" : " locked");
      if (unlocked && s.file) {
        card.innerHTML = '<div class="still-img-wrap"><img src="' + s.file + '" alt="' + s.caption + '"></div><div class="still-label">' + s.caption + '</div>';
        card.onclick = function() { openViewer(s); };

        card.innerHTML = '<div class="still-img-wrap" style="display:flex;align-items:center;justify-content:center;background:rgba(196,154,216,.04)"><div style="font-size:10px;color:var(--accent);text-align:center;letter-spacing:.1em">IMAGE<br>COMING</div></div><div class="still-label">' + s.caption + '</div>';

      }
      cardGrid.appendChild(card);
    });
    block.appendChild(cardGrid);
    grid.appendChild(block);
  });
}

document.addEventListener("keydown", function(e) {
  if (e.code === "Space" || e.code === "Enter" || e.code === "ArrowRight") {
    if (document.getElementById("game-screen").classList.contains("visible")) {
      e.preventDefault();
      nextScene();
    }
  }
  if (e.code === "Escape") {
    if (document.getElementById("menu-overlay").classList.contains("visible")) closeMenu();
    else if (document.getElementById("game-screen").classList.contains("visible")) openMenu();
  }
});
</script>
</body>
</html>
